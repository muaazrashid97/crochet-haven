<!-- shop/templates/shop/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crochet Haven 🧵</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Fonts from Google -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-gray-800 font-[Inter]">

<!-- NAVBAR — Ayné Crochet -->
<header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
  <nav class="mx-auto max-w-7xl h-24 px-4 sm:px-6 lg:px-8 flex items-center justify-between">
    
<!-- Logo (Brand) -->
<a href="{% url 'home' %}" class="flex items-center gap-3">
  <img
    src="https://res.cloudinary.com/dnpzhdwpo/image/upload/f_auto,q_auto,w_320/v1760828109/ayne-crochet-logo-transparent_bov33k.png"
    alt="Ayné Crochet logo"
    class="h-16 md:h-20 w-auto"
    loading="eager"
    fetchpriority="high">
</a>

    <!-- Navigation Links -->
    <div class="flex items-center gap-8">
      <a href="{% url 'home' %}" class="text-[color:var(--ink)] hover:text-[#86A9C6] font-medium transition">Home</a>
      <a href="{% url 'product_list' %}" class="text-[color:var(--ink)] hover:text-[#86A9C6] font-medium transition">Products</a>
      <a href="#" class="text-[color:var(--ink)] hover:text-[#86A9C6] font-medium transition">About</a>
      <a href="#" class="text-[color:var(--ink)] hover:text-[#86A9C6] font-medium transition">Contact</a>
    </div>
  </nav>
</header>


    {% block content %}
    <!-- This block will be replaced in child templates -->
    {% endblock %}
</body>
</html>
